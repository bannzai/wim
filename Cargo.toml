[workspace]
resolver = "3"
members = [
    "crates/wim-core",
    "crates/wim-protocol",
    "crates/wim-wasm",
    "crates/wim-daemon",
    "crates/wim-plugin-host",
    "crates/vimacro",
    "crates/wim",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/bannzai/wim"

[workspace.dependencies]
# version は crates.io へ publish する時に path 参照の代わりに使われる (cargo package が要求する)
wim-core = { path = "crates/wim-core", version = "0.0.0" }
wim-protocol = { path = "crates/wim-protocol", version = "0.0.0" }
wim-daemon = { path = "crates/wim-daemon", version = "0.0.0" }
wim-plugin-host = { path = "crates/wim-plugin-host", version = "0.0.0" }
ropey = "1.6"
# The daemon's confinement: a directory handle every path under the root is opened relative to,
# rather than a canonicalized path compared against the root
# (`documents/adr/0003-daemon-beneath-semantics-with-cap-std.md`).
cap-std = "4.0"
# `OpenOptions::follow`, which cap-std keeps out of its own API because `std` has nothing like it.
# The in-place write of `fs.write` needs it: what it opens has to be the file itself and never a
# link left at its name (`documents/adr/0003-daemon-beneath-semantics-with-cap-std.md`).
cap-fs-ext = "4.0"
# Pinned rather than left to a caret range, the way `wit-bindgen` is in plugins/Cargo.toml: the
# host bindings this generates are the other half of the ABI, and wasmtime's component API still
# moves between majors.
wasmtime = { version = "=48.0.1", default-features = false, features = [
    "component-model",
    "cranelift",
    "runtime",
    "std",
] }
wasm-bindgen = "0.2"
unicode-segmentation = "1.12"
regex = "1.11"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The JSONC reader for `wim.jsonc`. Kept to its `serde` feature: what it parses becomes a
# `serde_json::Value` and the schema is checked by serde, so nothing here is a JSON parser of its
# own (`documents/CONFIG.md`).
jsonc-parser = { version = "0.33", default-features = false, features = ["serde"] }
toml = "1.1"
tokio = { version = "1.53", features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
notify = "8.2"
getrandom = "0.4"
assert_cmd = "2.0"
wat = "1.254"
predicates = "3.1"
tempfile = "3.14"
