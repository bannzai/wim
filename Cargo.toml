[workspace]
resolver = "3"
members = ["crates/wim-core", "crates/vimacro"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/bannzai/wim"

[workspace.dependencies]
wim-core = { path = "crates/wim-core" }
ropey = "1.6"
unicode-segmentation = "1.12"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
