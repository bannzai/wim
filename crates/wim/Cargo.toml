[package]
name = "wim"
version = "0.0.0"
description = "Command line front end of wim. Runs the daemon that serves a directory to wim clients."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
wim-core.workspace = true
wim-daemon.workspace = true
wim-plugin-host.workspace = true
clap.workspace = true
# A config is JSONC (`documents/CONFIG.md`), which serde_json alone cannot read: it is this that
# reads the comments and the trailing commas, and serde_json that turns the value into the schema.
jsonc-parser.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
# The end-to-end test talks to the binary it started, the way a client would.
wim-protocol.workspace = true
assert_cmd.workspace = true
futures-util.workspace = true
predicates.workspace = true
tokio-tungstenite.workspace = true
tempfile.workspace = true
