[package]
name = "hello-wim"
version = "0.0.0"
description = "First-party sample plugin. Shows the smallest useful shape of the wim plugin ABI."
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# cdylib is the wasm module wasm-tools turns into a component; rlib keeps the crate
# testable on a native target, where the generated bindings are never called.
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen.workspace = true
