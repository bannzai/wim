name: CI

on:
  pull_request:
  push:
    branches: [main]

# Every job runs pull-request-controlled code, so none of them gets more than read access.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The vendored tree-sitter runtime and grammars are committed and served as they are, so
      # what is in the tree has to be what the script installed.
      - run: bash scripts/vendor-tree-sitter.sh --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p wim-core --target wasm32-unknown-unknown
      - run: cargo build -p wim-protocol --target wasm32-unknown-unknown
      - run: cargo build -p wim-wasm --target wasm32-unknown-unknown

  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The host that loads the plugin lives in the root workspace, and the plugin itself in
          # its own, so this job builds out of both.
          workspaces: |
            .
            plugins
      # The generated bindings compile on the host target, so the ABI and the plugins are checked
      # here the same way they are locally.
      - run: make check-plugins
      - run: make build-plugins
      # The one place the two halves of the ABI meet: the components built just above are loaded
      # by the native host and run. This is the only job that builds them, so it is the only one
      # where those tests do anything; in the `test` job they step aside for want of a component,
      # the way they do on a machine that cannot build one.
      - run: make test-plugin-host

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The plugins the demo loads are built out of their own workspace, the way the
          # `plugins` job builds them.
          workspaces: |
            .
            plugins
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version "$(bash scripts/wasm-bindgen-version.sh)" --locked
      - run: make build-web
      # The file-access run starts this binary over a directory of its own and drives the demo
      # against it, and the plugin run loads the component through it, so the binary has to be
      # built before the browser is.
      - run: cargo build -p wim
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Installs the node packages, builds the first-party plugins and transpiles them into the
      # modules the demo imports. Nothing it writes is committed, so the demo gets its plugins
      # here rather than out of the tree.
      - run: make build-web-plugins
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
        env:
          # The very components the step above transpiled, so that the run puts one `.wasm` of
          # each through both hosts. The paths are `HELLO_WIM` and `MARKDOWN_PREVIEW` in the
          # Makefile; the run fails rather than skipping when one of them names no file.
          WIM_PLUGIN_WASM: ${{ github.workspace }}/plugins/target/wasm32-unknown-unknown/release/hello_wim.component.wasm
          WIM_MARKDOWN_PREVIEW_WASM: ${{ github.workspace }}/plugins/target/wasm32-unknown-unknown/release/markdown_preview.component.wasm
